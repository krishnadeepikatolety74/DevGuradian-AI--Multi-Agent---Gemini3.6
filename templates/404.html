{% extends "base.html" %}

{% block title %}Page Not Found — DevGuardian AI{% endblock %}

{% block standalone_content %}
<div class="auth-page-container">
    <div class="auth-card" style="text-align: center;">
        <div style="font-size: 64px; font-weight: 800; color: #17191D; line-height: 1; margin-bottom: 12px;">404</div>
        <h1 style="font-size: 20px; margin-bottom: 8px;">Resource Not Found</h1>
        <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 24px;">
            The project workspace or page you requested does not exist or has been relocated.
        </p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary" style="display: inline-flex;">
            Return to Dashboard &rarr;
        </a>
    </div>
</div>
{% endblock %}
